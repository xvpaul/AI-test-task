name: Deploy OpenClaw config

on:
  push:
    branches: [main]
    paths:
      - "openclaw.config.template.json5"
      - "SOUL.md"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: # позволяет запустить деплой вручную из вкладки Actions

concurrency:
  group: deploy-vps
  cancel-in-progress: false # не обрывать деплой на середине

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Страховка от случайного коммита реального ключа вместо плейсхолдера.
      # Дешевле поймать здесь, чем отзывать засветившийся ключ.
      - name: Проверить, что в репозитории нет секретов
        run: |
          set -euo pipefail
          pattern='AIza[0-9A-Za-z_-]{35}|AQ\.[A-Za-z0-9_-]{25,}|[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}|BEGIN [A-Z ]*PRIVATE KEY'
          # -I пропускает бинарные файлы, .git исключаем явно
          if grep -rInE "$pattern" . --exclude-dir=.git >/dev/null 2>&1; then
            echo "::error::в репозитории найдено похожее на реальный секрет"
            # Печатаем только файл и номер строки, не содержимое
            grep -rInE "$pattern" . --exclude-dir=.git | cut -d: -f1,2
            exit 1
          fi
          echo "Секретов в репозитории не найдено"

      - name: Проверить, что все секреты заданы
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=0
          for v in GEMINI_API_KEY TELEGRAM_BOT_TOKEN TELEGRAM_OWNER_ID \
                   VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            if [ -z "${!v:-}" ]; then
              echo "::error::секрет $v не задан"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Отрендерить конфиг из шаблона
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          # Не секрет — переключается через переменную репозитория.
          # allowlist (по умолчанию) → только владелец; open → отвечает всем.
          TELEGRAM_DM_POLICY: ${{ vars.TELEGRAM_DM_POLICY || 'allowlist' }}
        run: |
          set -euo pipefail

          # allowFrom зависит от режима, поэтому собирается здесь, а не в шаблоне.
          # Значение подставляется вместе с кавычками — в шаблоне голые скобки.
          case "${TELEGRAM_DM_POLICY}" in
            open)
              # Ровно "*": без звёздочки в списке режим open не валиден.
              # Соседство "*" с конкретным ID не проверялось — не смешиваем.
              TELEGRAM_ALLOW_FROM='"*"'
              ;;
            allowlist|pairing)
              TELEGRAM_ALLOW_FROM="\"${TELEGRAM_OWNER_ID}\""
              ;;
            disabled)
              TELEGRAM_ALLOW_FROM=""
              ;;
            *)
              # Опечатка в переменной репозитория иначе уехала бы на сервер
              # и превратилась в молчащего бота без единой ошибки в логах.
              echo "::error::TELEGRAM_DM_POLICY имеет недопустимое значение"
              exit 1
              ;;
          esac
          export TELEGRAM_ALLOW_FROM
          echo "режим личных сообщений: ${TELEGRAM_DM_POLICY}"

          # Имя файла обязано быть openclaw.json — шлюз читает
          # ~/.openclaw/openclaw.json и ничего другого. Содержимое при этом
          # в формате JSON5 (комментарии и висячие запятые допустимы).
          # Файл с любым другим именем молча игнорируется, а шлюз стартует
          # на дефолтах — без gateway.mode, провайдера и Telegram.
          envsubst '${GEMINI_API_KEY} ${TELEGRAM_BOT_TOKEN} ${TELEGRAM_DM_POLICY} ${TELEGRAM_ALLOW_FROM}' \
            < openclaw.config.template.json5 > openclaw.json

          # Убедиться, что не осталось неподставленных плейсхолдеров
          if grep -q '\${' openclaw.json; then
            echo "::error::в конфиге остались неподставленные плейсхолдеры"
            grep -n '\${' openclaw.json
            exit 1
          fi
          echo "Конфиг отрендерен, $(wc -l < openclaw.json) строк"

      - name: Настроить SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # known_hosts из секрета, а не ssh-keyscan на лету:
          # keyscan доверяет первому встречному ключу и не защищает от MITM.
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # Keepalive: без него долгие операции (git clone, docker pull)
          # рвутся по таймауту NAT/файрвола и выглядят как "Broken pipe".
          # BatchMode запрещает любые интерактивные запросы — падаем сразу,
          # а не зависаем до таймаута job.
          cat > ~/.ssh/config <<'EOF'
          Host *
            BatchMode yes
            ServerAliveInterval 30
            ServerAliveCountMax 10
            ConnectTimeout 15
          EOF
          chmod 600 ~/.ssh/config

      # Идемпотентно: на первом запуске ставит OpenClaw, дальше просто проверяет.
      - name: Bootstrap — установить OpenClaw, если его нет
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          COMPOSE_DIR: ${{ vars.COMPOSE_DIR || '' }}
          OPENCLAW_DIR: ${{ vars.OPENCLAW_DIR || '' }}
          OPENCLAW_IMAGE: ${{ vars.OPENCLAW_IMAGE || 'ghcr.io/openclaw/openclaw:latest' }}
          GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN || '' }}
        run: |
          set -euo pipefail
          # Скрипт передаётся файлом, а не по stdin: при `bash -s` упавший
          # удалённый скрипт закрывает канал, и ssh рапортует "Broken pipe"
          # вместо настоящей ошибки. Плюс git конфликтует за тот же stdin.
          scp -P "${VPS_PORT}" -i ~/.ssh/deploy_key \
            scripts/bootstrap-remote.sh \
            "${VPS_USER}@${VPS_HOST}:/tmp/openclaw-bootstrap.sh"

          # -n закрывает stdin: ни одна команда внутри не сможет на нём зависнуть
          ssh -n -p "${VPS_PORT}" -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" \
            "COMPOSE_DIR='${COMPOSE_DIR}' OPENCLAW_DIR='${OPENCLAW_DIR}' \
             OPENCLAW_IMAGE='${OPENCLAW_IMAGE}' GATEWAY_TOKEN='${GATEWAY_TOKEN}' \
             bash /tmp/openclaw-bootstrap.sh; rc=\$?; rm -f /tmp/openclaw-bootstrap.sh; exit \$rc"

      - name: Залить конфиг на VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          # Необязательный секрет: если не задан — стандартный 22.
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          # Каталог, смонтированный в контейнер как /home/node/.openclaw
          OPENCLAW_DIR: ${{ vars.OPENCLAW_DIR || '~/.openclaw' }}
        run: |
          set -euo pipefail
          # ВНИМАНИЕ: у scp порт задаётся заглавной -P, у ssh — строчной -p
          # Конфиг — в корень, SOUL.md — в workspace.
          # Персона читается только из workspace; в корне файл игнорируется.
          scp -P "${VPS_PORT}" -i ~/.ssh/deploy_key \
            openclaw.json \
            "${VPS_USER}@${VPS_HOST}:${OPENCLAW_DIR}/"

          scp -P "${VPS_PORT}" -i ~/.ssh/deploy_key \
            SOUL.md \
            "${VPS_USER}@${VPS_HOST}:${OPENCLAW_DIR}/workspace/"

      # Владельца правим ПОСЛЕ scp: файлы прилетают от root, а внутри
      # контейнера процесс работает под node и не может в них писать.
      - name: Права и перезапуск Gateway
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          COMPOSE_DIR: ${{ vars.COMPOSE_DIR || '' }}
          OPENCLAW_DIR: ${{ vars.OPENCLAW_DIR || '' }}
          OPENCLAW_IMAGE: ${{ vars.OPENCLAW_IMAGE || 'ghcr.io/openclaw/openclaw:latest' }}
        run: |
          set -euo pipefail
          scp -P "${VPS_PORT}" -i ~/.ssh/deploy_key \
            scripts/deploy-remote.sh \
            "${VPS_USER}@${VPS_HOST}:/tmp/openclaw-deploy.sh"

          ssh -n -p "${VPS_PORT}" -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" \
            "COMPOSE_DIR='${COMPOSE_DIR}' OPENCLAW_DIR='${OPENCLAW_DIR}' \
             OPENCLAW_IMAGE='${OPENCLAW_IMAGE}' \
             bash /tmp/openclaw-deploy.sh; rc=\$?; rm -f /tmp/openclaw-deploy.sh; exit \$rc"

      - name: Удалить ключ и отрендеренный конфиг
        if: always() # выполняется даже если деплой упал
        run: rm -f ~/.ssh/deploy_key openclaw.json
